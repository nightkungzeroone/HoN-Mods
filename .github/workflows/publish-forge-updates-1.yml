name: Publish HoN Mods - Forge Updates 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-forge-updates-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify six packages
        shell: bash
        env:
          SOURCE_BASE: "https://host-vessel-participating-spread.trycloudflare.com"
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --output "assets/BossBuildingV2_0.honmod" "$SOURCE_BASE/BossBuildingV2_0.honmod"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --output "assets/DayNightClockTooltip_v1.1_Fix.honmod" "$SOURCE_BASE/DayNightClockTooltip_v1.1_Fix.honmod"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --output "assets/HealthBarPlusV2_0.honmod" "$SOURCE_BASE/HealthBarPlusV2_0.honmod"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --output "assets/ModOptionsHub_v1_1.honmod" "$SOURCE_BASE/ModOptionsHub_v1_1.honmod"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --output "assets/Neutral_Pet_HealthBarPlus.honmod" "$SOURCE_BASE/Neutral_Pet_HealthBarPlus.honmod"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --output "assets/QuickAccountLogin_v1.honmod" "$SOURCE_BASE/QuickAccountLogin_v1.honmod"
          sha256sum -c <<'SHA256S'
          58337f0bed5a59a31407a8641aedaa08b46b2adfdbc6e4ce5219da5f05ec0200  assets/BossBuildingV2_0.honmod
          dcbc4f242f8a2a3b05b19ae7dc9947a8c6e1f533121a22ba7574c9ad8696cb80  assets/DayNightClockTooltip_v1.1_Fix.honmod
          16c6fd4a19f04b47201ca8c7a4b2d2eadf4882bd9dd866edae483ba02dcee92d  assets/HealthBarPlusV2_0.honmod
          d3025a6aaab6988a68303dba00ff46ffafff8e9c7a32b55cdff2a1343cbc960e  assets/ModOptionsHub_v1_1.honmod
          ea31335faebb4dd50c9efec1c31ef0f6a686ba3041e726ffdc85364d38e3a6c5  assets/Neutral_Pet_HealthBarPlus.honmod
          651ae91da7ac1c1b42dbafeefb5866d57ad0852e50f8559d878dc99c694c6830  assets/QuickAccountLogin_v1.honmod
          SHA256S
          test "$(find assets -maxdepth 1 -name '*.honmod' -type f | wc -l)" -eq 6
      - name: Publish normal release with assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create forge-updates-1 assets/*.honmod --repo "$GITHUB_REPOSITORY" --target main --title "HoN Mods - Forge Updates 1" --notes "Six verified Heroes of Newerth Reborn mod packages for Newerth Forge GitHub updates. BossBuilding 2.0.1; DayNight Clock Tooltip 1.1.1; HealthBarPlus 2.0.1; Mod Options Hub 1.1.1; Neutral Pet HealthBarPlus 1.0.1; Quick Account Login 1.0.1. Players with older packages without GitHub metadata must manually install one of these versions first." --latest
